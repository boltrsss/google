<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History - WiseConvert</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View your recent WiseConvert results saved locally in your browser.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="logo"><a href="index.html" style="text-decoration:none;color:#f9fafb;">WiseConvert</a></div>
    <nav class="top-nav">
      <a href="jpg-to-png.html">JPG→PNG</a>
      <a href="png-to-jpg.html">PNG→JPG</a>
      <a href="webp-to-jpg.html">WEBP</a>
      <a href="jpg-to-webp.html">JPG→WEBP</a>
      <a href="resize-image.html">Resize</a>
      <a href="compress-image.html">Compress</a>
      <a href="social-presets.html">Social</a>
      <a href="universal-convert.html">All-in-One</a>
      <a href="universal-crop.html">Crop</a>
      <a href="batch-convert.html">Batch</a>
      <a href="pdf-tools.html">PDF</a>
      <a href="qr-generator.html">QR</a>
      <a href="heic-avif.html">HEIC/AVIF</a>
      <a href="history.html">History</a>
    </nav>
    <div class="theme-toggle">
      <button id="theme-toggle-btn" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <section class="tool-panel">
        <h1>Recent History (Beta)</h1>
        <p>Your last 10 results are stored locally in your browser. No uploads to our servers.</p>
        <div class="tool-box">
          <div id="history-list" class="history-list"></div>
          <div style="margin-top:14px;">
            <button class="btn-primary" id="btn-clear-history">Clear History</button>
          </div>
        </div>
      </section>
      <footer class="footer">
        <p>© <span id="year"></span> WiseConvert. All rights reserved.</p>
      </footer>
    </div>
  </main>

  <script src="/js/dark-mode.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var year = document.getElementById('year');
    if (year) year.textContent = new Date().getFullYear();

    var container = document.getElementById('history-list');
    var list = [];
    try {
      var raw = localStorage.getItem('wiseconvert-history');
      if (raw) list = JSON.parse(raw);
    } catch (e) {}

    if (!list || list.length === 0) {
      container.innerHTML = '<p>No history yet. Use any tool to generate a result, then come back here.</p>';
    } else {
      var html = '';
      list.forEach(function(item, idx) {
        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">';
        html += '<div style="width:80px;height:60px;overflow:hidden;border-radius:8px;border:1px solid #e5e7eb;background:#000;">';
        html += '<img src="' + item.dataUrl + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
        html += '</div>';
        html += '<div style="flex:1;">';
        html += '<div style="font-size:13px;font-weight:600;">' + (item.filename || 'Result ' + (idx+1)) + '</div>';
        html += '<div style="font-size:12px;color:#6b7280;">' + (item.message || '') + '</div>';
        html += '<div style="font-size:11px;color:#9ca3af;">' + (item.time || '') + '</div>';
        html += '</div>';
        html += '<div><a href="' + item.dataUrl + '" download="' + (item.filename || 'result') + '" class="download-link" style="padding:6px 10px;font-size:12px;">Download</a></div>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    var btnClear = document.getElementById('btn-clear-history');
    btnClear.addEventListener('click', function() {
      localStorage.removeItem('wiseconvert-history');
      container.innerHTML = '<p>History cleared.</p>';
    });
  });
  </script>
</body>
</html>
