<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEIC to JPG Converter - QuickTools</title>
  <meta name="description" content="Convert HEIC to JPG instantly in your browser. Private, free, and fast. No signup.">
  <link rel="icon" href="../../assets/img/logo.svg">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <a href="../../index.html"><img class="logo" src="../../assets/img/logo.svg" alt="QuickTools logo"></a>
        <div>
          <div class="title">HEIC to JPG</div>
          <div class="tag">Convert iPhone photos instantly — no signup, no watermarks.</div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="ad">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="3333333333" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>

      <div class="drop-area" id="drop-area">
        <p>Drag & drop HEIC files here or click to select</p>
        <input type="file" id="fileInput" accept=".heic" multiple hidden />
        <button class="btn" onclick="document.getElementById('fileInput').click()">Choose Files</button>
        <p class="note">All conversions happen in your browser for privacy.</p>
      </div>

      <div class="output" id="output"></div>

      <div class="ad">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="4444444444" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>
    </div>

    <footer>© 2025 QuickTools • <a href="../../privacy.html">Privacy</a> • <a href="../../terms.html">Terms</a></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.3/dist/heic2any.min.js"></script>
  <script>
    const input = document.getElementById('fileInput');
    const output = document.getElementById('output');
    const drop = document.getElementById('drop-area');

    drop.addEventListener('click', () => input.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.background = '#e0e7ff'; });
    drop.addEventListener('dragleave', () => drop.style.background = '#f2f6ff');
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.style.background = '#f2f6ff';
      handleFiles(e.dataTransfer.files);
    });
    input.addEventListener('change', () => handleFiles(input.files));

    function handleFiles(files) {
      output.innerHTML = '';
      [...files].forEach(file => {
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const blob = await heic2any({ blob: e.target.result, toType: "image/jpeg" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = file.name.replace(/\.heic$/i, '.jpg');
            link.textContent = `Download ${link.download}`;
            output.appendChild(link);
          } catch (err) {
            const p = document.createElement('p');
            p.style.color='red';
            p.textContent = `Failed to convert ${file.name}`;
            output.appendChild(p);
          }
        };
        reader.readAsArrayBuffer(file);
      });
    }

    (window.adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</body>
</html>
