<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Free Online Converters – Fast, Private, No Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Lightning-fast online converters: HEIC to JPG, JPG to PNG, WebP to JPG, PDF tools, and more. Simple UI, private, and free.">
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta property="og:title" content="Free Online Converters" />
  <meta property="og:description" content="HEIC→JPG, JPG→PNG, WebP→JPG, PDF tools, more. Super fast & private." />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img class="logo" src="assets/img/logo.svg" alt="QuickTools logo">
        <div>
          <div class="title">QuickTools</div>
          <div class="tag">Fast, private file converters — perfect for everyday use</div>
        </div>
      </div>
    </header>

    <div class="ad">
      <!-- Replace with your AdSense code -->
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>

    <div class="search-wrap">
      <div class="search">
        🔎
        <input id="q" type="search" placeholder="Search a tool… e.g., HEIC to JPG, JPG to PNG, PDF Split" aria-label="Search tools">
      </div>
    </div>

    <div class="center" id="pills"></div>
    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="ad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>

    <footer>
      © 2025 QuickTools • <a href="privacy.html">Privacy</a> • <a href="terms.html">Terms</a>
    </footer>
  </div>

  <script>
    const tools = [
      { name:"HEIC to JPG", slug:"tools/heic-to-jpg/", desc:"Convert iPhone HEIC photos to JPG in your browser.", emoji:"🖼️" },
      { name:"JPG to PNG", slug:"#", desc:"Lossless PNG from JPG images. (Coming soon)", emoji:"🧊" },
      { name:"WebP to JPG", slug:"#", desc:"Turn WebP into widely compatible JPG. (Coming soon)", emoji:"🌐" },
      { name:"PNG to ICO", slug:"#", desc:"Create favicons/app icons from PNG. (Coming soon)", emoji:"🧩" },
      { name:"Image Resizer", slug:"#", desc:"Resize by px or presets (Shopify/Pinterest). (Coming soon)", emoji:"📏" },
      { name:"EXIF Remover", slug:"#", desc:"Strip GPS/EXIF for privacy. (Coming soon)", emoji:"🧹" },
      { name:"PDF Split", slug:"#", desc:"Split PDFs into pages instantly. (Coming soon)", emoji:"✂️" },
      { name:"PDF Merge", slug:"#", desc:"Combine PDFs quickly. (Coming soon)", emoji:"🧷" },
      { name:"SRT Time Shift", slug:"#", desc:"Fix subtitle delays (± seconds). (Coming soon)", emoji:"⏱️" },
      { name:"Audio Normalize", slug:"#", desc:"Set podcast loudness (LUFS). (Coming soon)", emoji:"🔊" }
    ];

    const pillsC = document.getElementById('pills');
    ["HEIC to JPG","JPG to PNG","WebP to JPG","PDF Split"].forEach(label=>{
      const t = tools.find(x=>x.name===label);
      if(!t) return;
      const a = document.createElement('a');
      a.className = 'pill';
      a.href = t.slug;
      a.textContent = label;
      pillsC.appendChild(a);
    });

    const grid = document.getElementById('grid');
    function render(list){
      grid.innerHTML='';
      list.forEach(t=>{
        const a=document.createElement('a');
        a.className='card';
        a.href=t.slug;
        a.innerHTML = `
          <div class="ico">${t.emoji}</div>
          <div>
            <div class="name">${t.name}</div>
            <div class="desc">${t.desc}</div>
          </div>`;
        grid.appendChild(a);
      });
    }
    render(tools);

    const q = document.getElementById('q');
    q.addEventListener('input', e=>{
      const s = e.target.value.trim().toLowerCase();
      const f = tools.filter(t => (t.name + ' ' + t.desc).toLowerCase().includes(s));
      render(f.length?f:tools);
    });

    (window.adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</body>
</html>
