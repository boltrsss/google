<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEIC to JPG Converter - QuickTools</title>
  <meta name="description" content="Convert HEIC to JPG instantly in your browser. Private, free, and fast. No signup.">
  <link rel="icon" href="../../assets/img/logo.svg">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <a href="../../index.html"><img class="logo" src="../../assets/img/logo.svg" alt="QuickTools logo"></a>
        <div>
          <div class="title">HEIC to JPG</div>
          <div class="tag">Convert iPhone photos instantly — no signup, no watermarks.</div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="ad">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="3333333333" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>

      <div class="drop-area" id="drop-area">
        <p>Drag & drop HEIC files here or click to select</p>
        <input type="file" id="fileInput" accept=".heic,.HEIC,image/heic,image/heif" multiple hidden />
        <button class="btn" id="chooseBtn">Choose Files</button>
        <p class="note">All conversions happen in your browser for privacy.</p>
      </div>

      <div class="output" id="output"></div>

      <div class="ad">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="4444444444" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>
    </div>

    <footer>© 2025 QuickTools • <a href='../../privacy.html'>Privacy</a> • <a href='../../terms.html'>Terms</a></footer>
  </div>

  <!-- Primary lightweight decoder -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.3/dist/heic2any.min.js" crossorigin="anonymous"></script>
  <script>
    const input = document.getElementById('fileInput');
    const output = document.getElementById('output');
    const drop = document.getElementById('drop-area');
    const choose = document.getElementById('chooseBtn');

    choose.addEventListener('click', (e) => {
  e.preventDefault(); // stop form-style reload
  e.stopPropagation();
  input.click();
});

    drop.addEventListener('click', () => input.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.background = '#e0e7ff'; });
    drop.addEventListener('dragleave', () => drop.style.background = '#eef3ff');
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.style.background = '#eef3ff';
      if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
    });
    input.addEventListener('change', () => handleFiles(input.files));

    async function convertWithHeic2Any(file){
      const res = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.92 });
      return Array.isArray(res) ? res[0] : res;
    }

    async function loadLibHeif(){
      if (window.libheif) return;
      await new Promise((resolve, reject)=>{
        const s = document.createElement('script');
        s.src = "https://cdn.jsdelivr.net/npm/libheif-js@1.14.0/dist/libheif.js";
        s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
      });
    }

    async function convertWithLibHeif(file){
      await loadLibHeif();
      const buf = await file.arrayBuffer();
      const heif = new libheif.HeifDecoder();
      const images = heif.decode(buf);
      const first = images[0];
      const rgba = first.display(); // { width, height, data (Uint8ClampedArray RGBA) }
      const cnv = document.createElement('canvas');
      cnv.width = rgba.width; cnv.height = rgba.height;
      const ctx = cnv.getContext('2d');
      const imgData = new ImageData(rgba.data, rgba.width, rgba.height);
      ctx.putImageData(imgData, 0, 0);
      const dataUrl = cnv.toDataURL('image/jpeg', 0.92);
      const bstr = atob(dataUrl.split(',')[1]);
      const u8 = new Uint8Array(bstr.length);
      for (let i=0;i<bstr.length;i++) u8[i]=bstr.charCodeAt(i);
      return new Blob([u8], { type: 'image/jpeg' });
    }

    function addRowMessage(text, cls){
      const p = document.createElement('p');
      p.textContent = text;
      p.className = cls || '';
      output.appendChild(p);
      return p;
    }

    function handleFiles(fileList) {
      output.innerHTML = '';
      const files = Array.from(fileList);
      if (!files.length) return;
      files.forEach(async (file) => {
        const row = addRowMessage('Converting '+file.name+'…');
        try {
          let jpgBlob;
          try {
            jpgBlob = await convertWithHeic2Any(file);
          } catch(e1){
            // fallback path
            row.textContent = 'Trying fallback decoder for '+file.name+'…';
            jpgBlob = await convertWithLibHeif(file);
          }
          const url = URL.createObjectURL(jpgBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name.replace(/\.(heic|HEIC)$/,'') + '.jpg';
          a.textContent = `Download ${a.download}`;
          row.innerHTML = '';
          row.appendChild(a);
        } catch (err) {
          row.className = 'err';
          row.textContent = 'Failed to convert '+file.name;
          console.error('HEIC convert error', err);
        }
      });
    }

    (window.adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</body>
</html>
