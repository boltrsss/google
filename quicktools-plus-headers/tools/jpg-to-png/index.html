<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPG to PNG Converter - QuickTools</title>
  <meta name="description" content="Convert JPG to PNG instantly in your browser. Free, private, and fast.">
  <link rel="icon" href="../../assets/img/logo.svg">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <a href="../../index.html"><img class="logo" src="../../assets/img/logo.svg" alt="QuickTools logo"></a>
        <div>
          <div class="title">JPG to PNG</div>
          <div class="tag">Turn JPG images into PNG with one click — no upload.</div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="ad">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="5555555555" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>

      <div class="drop-area" id="drop-area">
        <p>Drag & drop JPG files here or click to select</p>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,image/jpeg" multiple hidden />
        <button class="btn" id="chooseBtn">Choose Files</button>
        <p class="note">Conversions run locally in your browser (privacy first).</p>
      </div>

      <div class="output" id="output"></div>

      <div class="ad">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-xxxxxxxxxxxxxxxx" data-ad-slot="6666666666" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>
    </div>

    <footer>© 2025 QuickTools • <a href='../../privacy.html'>Privacy</a> • <a href='../../terms.html'>Terms</a></footer>
  </div>

  <script>
    const input = document.getElementById('fileInput');
    const output = document.getElementById('output');
    const drop = document.getElementById('drop-area');
    const choose = document.getElementById('chooseBtn');

    choose.addEventListener('click', () => input.click());
    drop.addEventListener('click', () => input.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.background = '#e0e7ff'; });
    drop.addEventListener('dragleave', () => drop.style.background = '#eef3ff');
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.style.background = '#eef3ff';
      if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
    });
    input.addEventListener('change', () => handleFiles(input.files));

    function handleFiles(list){
      output.innerHTML='';
      const files = Array.from(list);
      files.forEach(async (file)=>{
        const row = document.createElement('p');
        row.textContent = 'Converting '+file.name+'…';
        output.appendChild(row);
        try{
          const img = new Image();
          img.onload = ()=>{
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img,0,0);
            c.toBlob((blob)=>{
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = file.name.replace(/\.(jpg|jpeg)$/i,'')+'.png';
              a.textContent = 'Download '+a.download;
              row.innerHTML = '';
              row.appendChild(a);
            }, 'image/png');
          };
          img.onerror = ()=>{ row.className='err'; row.textContent='Failed to convert '+file.name; };
          img.src = URL.createObjectURL(file);
        }catch(e){
          row.className='err'; row.textContent='Failed to convert '+file.name;
          console.error(e);
        }
      });
    }

    (window.adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</body>
</html>
